name: Notification dispatch

# Retries queued customer messages every 5 minutes. Vercel Hobby limits cron jobs to once a day,
# so the schedule lives here. Needs repository secrets SITE_URL (e.g. https://shop.example.com)
# and CRON_SECRET (the same value as the CRON_SECRET environment variable on Vercel).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the dispatch endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET repository secrets are required." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/notifications/dispatch"
